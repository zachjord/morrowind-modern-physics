# Builds this fork for Linux in a container (Arch Linux, like the desktop it runs on). See docker/arch/README.md.
#
#   docker compose run --rm build         # clone the physics branch from GitHub, build, test -> ./out
#   docker compose run --rm build-local   # build this checkout as it is (uncommitted changes too) -> ./out
#
# ("docker compose up" runs only the first, in the background: follow it with "docker compose logs -f build".)
#
# The compiler cache and build trees live in named volumes, so later builds only recompile what changed.

x-build: &build
  build:
    context: docker/arch
  image: morrowind-modern-physics-build:arch
  environment: &env
    BRANCH: ${BRANCH:-physics}
    REPO_URL: ${REPO_URL:-https://github.com/zachjord/morrowind-modern-physics.git}
    BUILD_TYPE: ${BUILD_TYPE:-RelWithDebInfo}
    JOBS: ${JOBS:-}
    BUILD_TESTS: ${BUILD_TESTS:-ON}
    RUN_TESTS: ${RUN_TESTS:-1}
    BUILD_LAUNCHER: ${BUILD_LAUNCHER:-ON}
    BUILD_OPENCS: ${BUILD_OPENCS:-OFF}
    EXTRA_CMAKE_ARGS: ${EXTRA_CMAKE_ARGS:-}
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}

services:
  build:
    <<: *build
    environment:
      <<: *env
      SOURCE: clone
    volumes:
      - ccache:/ccache
      - source:/src
      - build-clone:/build
      - ./out:/out

  # Only when asked for by name (so "docker compose up" doesn't run both builds at once).
  build-local:
    <<: *build
    profiles: [local]
    environment:
      <<: *env
      SOURCE: local
    volumes:
      - ccache:/ccache
      # Not read-only: the build refreshes the launcher's translation files (files/lang/*.ts) in place.
      - .:/src
      - build-local:/build
      - ./out:/out

volumes:
  ccache:
  source:
  build-clone:
  build-local:
